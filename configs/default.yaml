# MambaHybrid — default training config (RTX 5090 32 GB, ~100-200 shard subset).
# See src/mambahybrid/config.py for every field + default.

# ---- data ----
# On disk under datasets/waymo/motion/: training/ (90 shards, 00000-00089),
# validation/ (10 shards, full 91-step + future GT), testing/ (11-step, no future).
train_shards: "/workspace/datasets/waymo/motion/training/training.tfrecord-000[0-8]*-of-01000"
val_shards:   "/workspace/datasets/waymo/motion/validation/validation.tfrecord-*-of-00150"
cache_dir: null             # per-scenario preprocessed-sample .npz cache. null = off
                            # (workers re-parse protos every epoch). The full cache is
                            # ~2.5 GB/shard (~225 GB for 90 shards) — far over the
                            # ~30 GB free here, so leave it off, or point it at a
                            # small val-only run. The tiny .offidx.json seek indexes
                            # next to each shard are written regardless and are fine.
n_slots: 300
fov_radius: 100.0
max_map_tokens: 256
poly_points: 20
pos_scale: 50.0
vel_scale: 10.0
size_scale: 10.0
occlusion_prob: 0.5          # synthetic occlusion per eligible track (spec 3.3.2)
occlusion_max_gaps: 2
random_rotate: true
subtract_ego_velocity: false

# ---- model ----
encoder: "mamba"             # "mamba" | "gru" | "attn"  (ablation, spec 3.4.2)
d_model: 128
mamba_layers: 4
mamba_d_state: 16
mamba_d_conv: 4
mamba_expand: 2
decoder_layers: 2
n_heads: 4
n_modes: 6                   # K
horizon: 50                  # future steps per prediction (5.0 s @ 10 Hz)
warmup_steps: 10             # no loss / no prediction before this step
min_future_steps: 10
grad_checkpoint: true

# ---- loss weights (spec 3.2.6) ----
lambda_aux: 0.5
lambda_next: 0.5
lambda_recon_ft: 1.0
lambda_recon_fupd: 1.0
lambda_traj: 1.0
lambda_mode: 0.5

# ---- optim ----
batch_size: 8               # compile + batch 8 = 22.1 GB peak / 32, no leak on
                            # torch 2.8. batch 10 = 27.7 GB (tight), 12 OOMs.
                            # see scripts/probe_compile.py for the sweep
lr: 3.0e-4                  # tuned at batch 4; still fine at batch 8 (kept)
weight_decay: 0.01
grad_clip: 1.0
max_steps: 17000            # ~3 epochs over the 90-shard subset (~5500 steps/epoch
                            # at batch 8), ~2.7 h at ~1.7 it/s (compile). --resume
                            # runs/exp1/last.pt to continue if val still improving
warmup_iters: 1000
log_every: 50
val_every: 1500
ckpt_dir: "runs/exp1"
num_workers: 6
seed: 0
amp: false                  # measurably no speedup here (launch-bound) and the
                            # selective scan is fp32-only anyway
compile: true               # ~2x over eager, no memory leak on torch 2.8 (the
                            # 2.4.1 inductor leak is fixed). train.py forces amp
                            # off when this is on. see scripts/probe_compile.py
device: "cuda"

# ---- logging ----
wandb: false                 # needs `pip install wandb` + `wandb login` on the pod
wandb_project: "inertnet"
