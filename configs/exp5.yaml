# MambaHybrid — exp5: scale-up (RTX 5090 32 GB, ~90-shard subset).
# Derived from configs/default.yaml. Roadmap: HANDOFF.md.
# exp4 (EWTA, d_model 128, 1.94 M params) plateaued at val minADE ~1.87 with
# train≈val → underfitting. exp5 raises capacity (d_model 128→256, mamba_layers
# 4→6, decoder_layers 2→4, n_heads 4→8; ~1.9 M → ~14 M params) and trains longer
# (17k→35k steps — exp4 was still improving at the end). lr is swept
# {5e-5, 1e-4, 2e-4} in short runs first (configs/exp5_lr*.yaml); this file holds
# the full run and its lr is set to the sweep winner before launch.

# ---- data ----
train_shards: "/workspace/datasets/waymo/motion/training/training.tfrecord-000[0-8]*-of-01000"
val_shards:   "/workspace/datasets/waymo/motion/validation/validation.tfrecord-*-of-00150"
cache_dir: null
n_slots: 300
fov_radius: 100.0
max_map_tokens: 256
poly_points: 20
pos_scale: 50.0
vel_scale: 10.0
size_scale: 10.0
occlusion_prob: 0.5
occlusion_max_gaps: 2
random_rotate: true
subtract_ego_velocity: false

# ---- model (scaled) ----
encoder: "mamba"
d_model: 256                # 128 -> 256
mamba_layers: 6             # 4 -> 6
mamba_d_state: 16
mamba_d_conv: 4
mamba_expand: 2
decoder_layers: 4           # 2 -> 4
n_heads: 8                  # 4 -> 8
n_modes: 6
horizon: 50
warmup_steps: 10
min_future_steps: 10
grad_checkpoint: true

# ---- loss weights (unchanged from exp4) ----
lambda_aux: 0.5
lambda_next: 0.5
lambda_recon_ft: 1.0
lambda_recon_fupd: 1.0
lambda_traj: 5.0
lambda_mode: 1.0

# ---- optim ----
batch_size: 4              # d_model 256 + compile: bs 8/6 OOM, bs 4 = 30.5/32 GB
                          # peak, flat (fixed-shape tensors), 1.15 it/s clean
lr: 2.0e-4                 # sweep winner: {5e-5: 2.092, 1e-4: 2.047, 2e-4: 2.026}
                          # val all/minADE @6k. 2e-4 = fastest convergence (2.04 by
                          # step 3000), no divergence; cosine decay handles the
                          # late-training volatility seen in the compressed sweep.
weight_decay: 0.01
grad_clip: 0.5
max_steps: 35000
warmup_iters: 1000
log_every: 50
val_every: 2000
ckpt_dir: "runs/exp5"
num_workers: 6
seed: 0
amp: false
compile: true
device: "cuda"

# ---- logging ----
wandb: false
wandb_project: "inertnet"
