# Baseline C (spec 3.4.2): GRU hybrid. Isolates "any recurrence" vs "Mamba".
train_shards: "dataset/Waymo/training/training.tfrecord-00[0-8]*-of-01000"
val_shards:   "dataset/Waymo/training/training.tfrecord-009[0-8]*-of-01000"
cache_dir: "cache"
n_slots: 300
max_map_tokens: 256

encoder: "gru"
d_model: 128
mamba_layers: 4          # reused as GRU depth
decoder_layers: 2
n_heads: 4
n_modes: 6
horizon: 50
warmup_steps: 10
min_future_steps: 10
grad_checkpoint: true

batch_size: 4
lr: 3.0e-4
max_steps: 120000
ckpt_dir: "runs/ablation_gru"
device: "cuda"
