[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mambahybrid"
version = "0.1.0"
description = "Occlusion-robust trajectory prediction on WOMD (Mamba + Transformer hybrid)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "einops>=0.7",
    "blackboxprotobuf>=1.0.1",
]

# wandb is intentionally NOT a dependency here: blackboxprotobuf's metadata
# pins protobuf==3.10.0, which collides with wandb's protobuf>=5. On the GPU
# box use requirements.txt (which installs blackboxprotobuf --no-deps); for
# local CPU work you don't need wandb (`wandb: false` in the config).

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
