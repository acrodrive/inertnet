[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mambahybrid"
version = "0.1.0"
description = "Occlusion-robust trajectory prediction on WOMD (Mamba + Transformer hybrid)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "einops>=0.7",
    "blackboxprotobuf>=1.0.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
